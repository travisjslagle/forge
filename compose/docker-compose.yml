services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: forge-homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
    volumes:
      - ${FORGE_ROOT}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: forge-homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      TZ: ${TZ}
    volumes:
      - ${FORGE_ROOT}/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: forge-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ${FORGE_ROOT}/mosquitto/config:/mosquitto/config
      - ${FORGE_ROOT}/mosquitto/data:/mosquitto/data
      - ${FORGE_ROOT}/mosquitto/log:/mosquitto/log

  node-red:
    image: nodered/node-red:latest
    container_name: forge-node-red
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      TZ: ${TZ}
    volumes:
      - ${FORGE_ROOT}/node-red:/data

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: forge-uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ${FORGE_ROOT}/uptime-kuma:/app/data

  forge-budget:
    build: ${FORGE_BUDGET_SOURCE}
    container_name: forge-budget
    restart: unless-stopped
    ports:
      - "${FORGE_LAN_IP}:3010:3010"
    environment:
      FORGE_BUDGET_DB_PATH: /data/budget.db
      FORGE_BUDGET_IMPORT_DIR: /data/imports/raw
      FORGE_BUDGET_PENDING_IMPORT_DIR: /data/imports/pending
      FORGE_BUDGET_ARCHIVE_DIR: /data/imports/archive
      FORGE_BUDGET_BACKUP_DIR: /data/backups
      FORGE_BUDGET_RESTIC_REPOSITORY: /data/restic-repo
      FORGE_BUDGET_RESTIC_PASSWORD_FILE: /data/secrets/restic-password
      FORGE_BUDGET_ENV: forge
      FORGE_BUDGET_SESSION_SECRET: ${FORGE_BUDGET_SESSION_SECRET}
    volumes:
      - ${FORGE_BUDGET_DATA}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3010/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
